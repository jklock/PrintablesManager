name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, lint and test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Network-dependent tests are #[ignore]d and require PO_LIVE=1.
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Frontend syntax
        run: node --check ui/dist/app.js

      - name: Frontend unit tests
        run: node --test ui/tests/markdown.test.mjs

  bundle:
    name: Build .dmg
    runs-on: macos-14
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build dmg
        working-directory: src-tauri
        run: cargo tauri build --bundles dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: printables-manager-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
